name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure (Win32, Release)
        run: cmake -B build -G "Visual Studio 17 2022" -A Win32

      - name: Build
        run: cmake --build build --config Release

      - name: Smoke Test (--version)
        shell: cmd
        run: |
          build\Release\WinDV.exe --version > version_out.txt 2>&1
          if %ERRORLEVEL% NEQ 0 exit /b 1
          findstr /C:"WinDV" version_out.txt
          if %ERRORLEVEL% NEQ 0 (echo Version string missing & type version_out.txt & exit /b 1)

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: WinDV-Release
          path: build/Release/WinDV.exe
